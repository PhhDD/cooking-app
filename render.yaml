services:
  - type: web
    name: cooking-app
    runtime: python
    plan: free

    buildCommand: uv sync --frozen --no-dev

    startCommand: uv run alembic upgrade head && uv run uvicorn cooking_app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15

      - key: DATABASE_URL
        sync: false

      - key: SESSION_SECRET_KEY
        sync: false

      - key: LOGTO_ENDPOINT
        sync: false

      - key: LOGTO_APP_ID
        sync: false

      - key: LOGTO_APP_SECRET
        sync: false

      - key: APP_BASE_URL
        sync: false
