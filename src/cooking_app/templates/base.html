<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Cooking App{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='styles.css') }}"
    >

    {% block head %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <a href="/recipes" class="site-brand">
            Cooking App
        </a>

	{% block header_search %}{% endblock %}

        <nav class="account-navigation" aria-label="Account navigation">
            {% if is_authenticated %}
                <a href="/sign-out">Sign out</a>
            {% else %}
                <a href="/sign-in">Sign in</a>
            {% endif %}
        </nav>
    </header>

    {% block collection_navigation %}{% endblock %}

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
