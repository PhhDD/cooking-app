{% extends "base.html" %}

{% block title %}New Recipe · Cooking App{% endblock %}

{% block content %}
<section class="form-page">
    <a href="/recipes">← Back to recipes</a>

    <header class="page-heading">
        <p class="eyebrow">NEW RECIPE</p>
        <h1>Add a recipe</h1>
        <p>
            Start with the basic details. You can add ingredients
            and cooking steps next.
        </p>
    </header>

    <form
        action="/recipes"
        method="post"
        class="recipe-form"
    >
        <label for="recipe_name">
            Recipe name
        </label>

        <input
            id="recipe_name"
            name="recipe_name"
            type="text"
            autocomplete="off"
            required
        >

        <label for="cuisine">
            Cuisine
        </label>

        <input
            id="cuisine"
            name="cuisine"
            type="text"
        >

        <label for="cook_time">
            Cooking time in minutes
        </label>

        <input
            id="cook_time"
            name="cook_time"
            type="number"
            min="1"
            required
        >

        <label for="servings">
            Servings
        </label>

        <input
            id="servings"
            name="servings"
            type="number"
            min="1"
            required
        >

        <button type="submit">
            Save recipe
        </button>
    </form>
</section>
{% endblock %}
