{% extends "base.html" %}

{% block title %}Edit {{ recipe.recipe_name }} · Cooking App{% endblock %}

{% block content %}
<section class="form-page">
    <a href="/recipes/{{ recipe.id }}">← Back to recipe</a>

    <header class="page-heading">
        <p class="eyebrow">EDIT RECIPE</p>
        <h1>{{ recipe.recipe_name }}</h1>
    </header>

    <form
        action="/recipes/{{ recipe.id }}/edit"
        method="post"
        class="recipe-form"
    >
        <label for="recipe_name">
            Recipe name
        </label>

        <input
            id="recipe_name"
            name="recipe_name"
            type="text"
            value="{{ recipe.recipe_name }}"
            required
        >

        <label for="cuisine">
            Cuisine
        </label>

        <input
            id="cuisine"
            name="cuisine"
            type="text"
            value="{{ recipe.cuisine or '' }}"
        >

        <label for="cook_time">
            Cooking time in minutes
        </label>

        <input
            id="cook_time"
            name="cook_time"
            type="number"
            min="1"
            value="{{ recipe.cook_time }}"
            required
        >

        <label for="servings">
            Servings
        </label>

        <input
            id="servings"
            name="servings"
            type="number"
            min="1"
            value="{{ recipe.servings }}"
            required
        >

        <button type="submit">
            Save changes
        </button>
    </form>
</section>
{% endblock %}
